<script>
// Asset path → resource id map. After the bundler unpacks, window.__resources[id]
// holds a blob URL. A MutationObserver rewrites every <img src> on the fly so we
// don't need to touch app.jsx or copy.js.
window.__assetMap = {
  "assets/logo.png": "logo",
  "assets/hero.jpeg": "hero",
  "assets/family.png": "family",
  "assets/dining.jpeg": "dining",
  "assets/coffee.jpeg": "coffee",
  "assets/breakfast.jpeg": "breakfast",
  "assets/window-seat.jpeg": "windowseat",
  "assets/guests.jpeg": "guests",
  "assets/dessert-counter.jpeg": "dessertcounter",
  "assets/dish-soup.jpeg": "dishsoup",
  "assets/dish-caesar.jpeg": "dishcaesar",
  "assets/dish-pie.jpeg": "dishpie",
  "assets/dessert-mango.jpeg": "dessertmango",
  "assets/dessert-napoleon.jpeg": "dessertnapoleon",
  "assets/dessert-berry.jpeg": "dessertberry",
};
window.__resolveAsset = function (src) {
  if (!src) return src;
  const id = window.__assetMap[src];
  if (id && window.__resources && window.__resources[id]) return window.__resources[id];
  return src;
};
(function () {
  function patchImg(img) {
    const cur = img.getAttribute("src");
    if (!cur) return;
    const resolved = window.__resolveAsset(cur);
    if (resolved !== cur) img.setAttribute("src", resolved);
  }
  const obs = new MutationObserver(function (muts) {
    for (const m of muts) {
      if (m.type === "attributes" && m.target.tagName === "IMG") {
        patchImg(m.target);
      }
      if (m.addedNodes) {
        m.addedNodes.forEach(function (n) {
          if (n.nodeType !== 1) return;
          if (n.tagName === "IMG") patchImg(n);
          if (n.querySelectorAll) n.querySelectorAll("img").forEach(patchImg);
        });
      }
    }
  });
  obs.observe(document.documentElement, {
    childList: true, subtree: true,
    attributes: true, attributeFilter: ["src"],
  });
  // Also sweep once after load in case some images were already in the DOM.
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("img").forEach(patchImg);
  });
})();
</script>
